<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Blog</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body{font-family:Poppins;margin:0}

header{
  background:linear-gradient(to right,#36d1dc,#5b86e5);
  color:#fff;
  text-align:center;
  padding:10px;
}

.cols{column-count:2;padding:15px}

.box{display:flex;flex-wrap:wrap}

.card{
  flex:1 1 150px;
  margin:10px;
  padding:10px;
  background:#eee;
  text-align:center;
  transition:.3s;
}

.card:hover{
  transform:scale(1.05);
  background:#dbeafe;
}

i{font-size:24px;margin-bottom:5px}

@media(max-width:600px){.cols{column-count:1}}
</style>
</head>

<body>

<header>
  <h2><i class="fa-solid fa-plane"></i> Travel Blog</h2>
</header>

<div class="cols">
  <p>Explore new places and experiences.</p>
  <p>Quick travel tips and ideas.</p>
</div>

<div class="box">
  <div class="card">
    <i class="fa-solid fa-star"></i>
    <h4>Destinations</h4>
    <p>Top places to visit</p>
  </div>

  <div class="card">
    <i class="fa-solid fa-heart"></i>
    <h4>Experiences</h4>
    <p>Memorable activities</p>
  </div>

  <div class="card">
    <i class="fa-solid fa-globe"></i>
    <h4>Explore</h4>
    <p>Discover the world</p>
  </div>
</div>

</body>
</html>
