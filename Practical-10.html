<!DOCTYPE html>
<html>
<head>
    <title>IFrame Demo</title>
    <style>
        body { margin: 0; font-family: Arial; }
        .header { background: #333; color: #fff; padding: 10px; text-align: center; }
        .container { display: flex; height: calc(100vh - 50px); }
        .nav { width: 25%; background: #444; padding: 10px; }
        .nav button {
            width: 100%;
            margin: 5px 0;
            padding: 10px;
            background: #666;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        .main { width: 75%; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div class="header">IFrame Demo</div>

<div class="container">
    <div class="nav">
        <button onclick="load('maps')">Maps</button>
        <button onclick="load('wiki')">Wikipedia</button>
        <button onclick="load('github')">GitHub</button>
        <button onclick="load('news')">News</button>
        <button onclick="load('youtube')">YouTube</button>
    </div>

    <div class="main">
        <iframe id="frame"></iframe>
    </div>
</div>

<script>
function load(type) {
    const urls = {
        maps: "https://www.google.com/maps",
        wiki: "https://en.wikipedia.org",
        github: "https://github.com",
        news: "https://www.bbc.com/news",
        youtube: "https://www.youtube.com"
    };
    document.getElementById("frame").src = urls[type];
}

window.onload = () => load('maps');
</script>

</body>
</html>
