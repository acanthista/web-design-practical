<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MiniSite</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
<div class="container">
<a class="navbar-brand">MiniSite</a>
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="navMenu">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link active">Home</a></li>
<li class="nav-item dropdown">
<a class="nav-link dropdown-toggle" data-bs-toggle="dropdown">Services</a>
<ul class="dropdown-menu">
<li><a class="dropdown-item">Web Design</a></li>
<li><a class="dropdown-item">Development</a></li>
<li><a class="dropdown-item">SEO</a></li>
</ul>
</li>
</ul>
</div>
</div>
</nav>

<div class="container mt-3">
<ol class="breadcrumb">
<li class="breadcrumb-item">Home</li>
<li class="breadcrumb-item active">Dashboard</li>
</ol>
</div>

<div class="container mt-4">
<div class="row">
<div class="col-md-4"><div class="p-3 bg-light border">1</div></div>
<div class="col-md-4"><div class="p-3 bg-light border">2</div></div>
<div class="col-md-4"><div class="p-3 bg-light border">3</div></div>
</div>
</div>

<div class="container mt-4">
<input class="form-control mb-2" placeholder="Name">
<input class="form-control mb-2" placeholder="Email">
<textarea class="form-control mb-2"></textarea>
<button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#m">Submit</button>
</div>

<div class="modal fade" id="m">
<div class="modal-dialog">
<div class="modal-content">
<div class="modal-body">Submitted</div>
<button class="btn btn-primary m-2" data-bs-dismiss="modal">OK</button>
</div>
</div>
</div>

<footer class="bg-dark text-white text-center p-2 mt-4">MiniSite</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
