<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bootstrap Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand" href="#">MyWebsite</a>
</div>
</nav>

<!-- Carousel -->
<div id="carousel" class="carousel slide" data-bs-ride="carousel">
<div class="carousel-inner">

<div class="carousel-item active">
<img src="https://picsum.photos/1200/400?random=1" class="d-block w-100">
</div>

<div class="carousel-item">
<img src="https://picsum.photos/1200/400?random=2" class="d-block w-100">
</div>

</div>

<button class="carousel-control-prev" type="button" data-bs-target="#carousel" data-bs-slide="prev">
<span class="carousel-control-prev-icon"></span>
</button>

<button class="carousel-control-next" type="button" data-bs-target="#carousel" data-bs-slide="next">
<span class="carousel-control-next-icon"></span>
</button>
</div>

<!-- Cards -->
<div class="container mt-4">
<div class="row">

<div class="col-md-4">
<div class="card">
<img src="https://picsum.photos/300?random=3" class="card-img-top">
<div class="card-body">
<h5>Card 1</h5>
<a class="btn btn-primary">Go</a>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card">
<img src="https://picsum.photos/300?random=4" class="card-img-top">
<div class="card-body">
<h5>Card 2</h5>
<a class="btn btn-success">Go</a>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card">
<img src="https://picsum.photos/300?random=5" class="card-img-top">
<div class="card-body">
<h5>Card 3</h5>
<a class="btn btn-danger">Go</a>
</div>
</div>
</div>

</div>
</div>

<!-- Buttons -->
<div class="text-center mt-4">
<button class="btn btn-primary">Primary</button>
<button class="btn btn-success">Success</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
