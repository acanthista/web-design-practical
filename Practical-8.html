<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Blog</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
body{font-family:Poppins;margin:0}

header{
  background:linear-gradient(to right,#36d1dc,#5b86e5);
  color:#fff;
  text-align:center;
  padding:10px;
}

.cols{column-count:2;padding:15px}

.box{display:flex;flex-wrap:wrap}

.card{
  flex:1 1 150px;
  margin:10px;
  padding:10px;
  background:#eee;
  text-align:center;
  transition:.3s;
}

.card:hover{
  transform:scale(1.05);
  background:#dbeafe;
}

@media(max-width:600px){.cols{column-count:1}}
</style>
</head>

<body>

<header>
  <h2><i class="fa fa-plane"></i> Travel Blog</h2>
</header>

<div class="cols">
  <p>Explore new places and experiences around the world.</p>
  <p>Simple guides, quick tips, and must-visit spots.</p>
</div>

<div class="box">
  <div class="card">
    <i class="fa fa-mountain"></i>
    <h4>Mountains</h4>
    <p>Peaceful and scenic</p>
  </div>

  <div class="card">
    <i class="fa fa-umbrella-beach"></i>
    <h4>Beaches</h4>
    <p>Relax and unwind</p>
  </div>

  <div class="card">
    <i class="fa fa-city"></i>
    <h4>Cities</h4>
    <p>Explore urban life</p>
  </div>
</div>
</body>
</html>
